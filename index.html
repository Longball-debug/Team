<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desert Rats — LONGBALL Dashboard</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a1a; font-size: 13px; background: #fff; padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
h2 { font-size: 15px; font-weight: 500; padding: 8px 12px; background: #f0f0ee; border-radius: 8px; margin: 20px 0 10px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 6px; }
th { text-align: left; font-weight: 500; font-size: 10px; color: #666; padding: 5px 7px; border-bottom: 0.5px solid #ddd; text-transform: uppercase; letter-spacing: 0.04em; }
td { padding: 6px 7px; border-bottom: 0.5px solid #eee; vertical-align: top; line-height: 1.5; }
tr:last-child td { border-bottom: none; }
.badge { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 6px; border-radius: 8px; white-space: nowrap; }
.g { background: #EAF3DE; color: #3B6D11; }
.r { background: #FCEBEB; color: #A32D2D; }
.a { background: #FAEEDA; color: #854F0B; }
.b { background: #E6F1FB; color: #185FA5; }
.gr { background: #F1EFE8; color: #5F5E5A; }
.note { font-size: 11px; color: #888; margin-top: 2px; }
.v { font-size: 10px; color: #3B6D11; }
.asm { font-size: 10px; color: #A32D2D; font-style: italic; }
.card { border-radius: 10px; padding: 10px 13px; margin-bottom: 8px; font-size: 12px; line-height: 1.6; border: 0.5px solid #ddd; }
.card strong, .card .ct { font-weight: 500; }
.card .ct { font-size: 13px; margin-bottom: 4px; display: block; }
.card .cb { color: #555; }
.lg { border-left: 3px solid #639922; }
.lr { border-left: 3px solid #E24B4A; }
.la { border-left: 3px solid #EF9F27; }
.lb { border-left: 3px solid #185FA5; }
.gp { display: inline-block; font-size: 11px; font-weight: 500; padding: 1px 7px; border-radius: 8px; }
.gp6 { background: #EAF3DE; color: #3B6D11; }
.gp5 { background: #FAEEDA; color: #854F0B; }
.nb { font-size: 9px; font-weight: 500; padding: 1px 4px; border-radius: 3px; background: #EEEDFE; color: #3C3489; margin-left: 3px; }
.tbox { background: #f5f5f3; border-radius: 7px; padding: 7px 10px; margin-top: 5px; font-size: 11px; line-height: 1.7; }
.tbox strong { font-weight: 500; display: block; margin-bottom: 2px; }
.sum { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
.sc { border-radius: 8px; padding: 9px; text-align: center; }
.sc .sl { font-size: 10px; color: #666; margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.03em; }
.sc .sv { font-size: 16px; font-weight: 500; }
strong { font-weight: 500; }
</style>
</head>
<body>
<div style="font-size:12px;font-weight:500;margin-bottom:14px">Desert Rats · LONGBALL</div>
<p id="freshness" role="status">Checking latest refresh…</p>
<h2>⚾ Desert Rats roster</h2>
<table><thead><tr><th>Player / Fantrax ID</th><th>Position</th><th>Status</th></tr></thead><tbody id="roster-rows"></tbody></table>
<h2>🏆 Season standings</h2>
<table><thead><tr><th>Team</th><th>Record</th><th>Season points</th></tr></thead><tbody id="standings-rows"></tbody></table>
<p class="note">Matchups, injuries, ratings and analysis are unavailable from this refresh.</p>
<script type="module" src="public/website.mjs"></script>
</body>
</html>
