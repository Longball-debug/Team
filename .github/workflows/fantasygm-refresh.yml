name: FantasyGM cloud refresh
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fantasygm-refresh.yml'
      - 'public_snapshot.py'
      - 'shared_snapshot.py'
      - 'wrangler.jsonc'
      - 'index.html'
      - 'public/website.mjs'
      - 'public/snapshot-contract.mjs'
  schedule:
  - cron: '45 5 * * *'
    timezone: "America/Phoenix"

permissions:
  contents: write

concurrency:
  group: fantasygm-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FANTRAX_USER_SECRET_ID: ${{ secrets.FANTRAX_USER_SECRET_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify data handling
        run: python -m unittest discover -v

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify website freshness contract
        run: node --test test_snapshot_contract.mjs

      - name: Collect Fantrax once
        run: python fantrax_refresh.py --root "$RUNNER_TEMP/fantasygm" --league-id gxq8uqpqmg5m5edj --no-prompt

      - name: Build complete sanitized website snapshot
        run: python public_snapshot.py --root "$RUNNER_TEMP/fantasygm"

      - name: Prepare Cloudflare static site
        run: |
          rm -rf dist
          mkdir -p dist/public
          cp index.html dist/index.html
          cp public/website.mjs dist/public/website.mjs
          cp public/snapshot-contract.mjs dist/public/snapshot-contract.mjs
          cp public/fantasygm.json dist/public/fantasygm.json

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Publish snapshot to GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fantasygm.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh sanitized FantasyGM website data'
            HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=$HEADER" push origin HEAD:main || echo 'Snapshot push skipped because main advanced; Cloudflare deploy already succeeded.'
          fi
