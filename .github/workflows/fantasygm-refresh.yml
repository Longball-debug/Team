name: FantasyGM readiness and private deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/fantasygm-refresh.yml', '*.py', 'test_*.mjs', 'public/*.mjs', 'public/scoring-model.json', 'index.html', 'wrangler.jsonc']
  schedule:
    - cron: '45 5 * * *'
      timezone: America/Phoenix
permissions:
  contents: read
concurrency:
  group: fantasygm-refresh
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Verify data and website contracts
        run: |
          python -m unittest discover -v
          node --test test_*.mjs
      - name: Verify 2027 scoring and keeper-roster readiness
        run: python readiness.py
      # Historical 2026 league is retired from the account's current league list.
      # Preserve its last verified publication. Never relabel it or merge 2027 ownership.
      - name: Refresh verified historical research statistics
        run: |
          cp public/fantasygm.json "$RUNNER_TEMP/research.json"
          python add_recent_14d_stats.py --snapshot "$RUNNER_TEMP/research.json"
          python add_player_lab_stats.py --snapshot "$RUNNER_TEMP/research.json"
          python add_pitcher_logs.py --snapshot "$RUNNER_TEMP/research.json"
      - name: Build retained historical research site
        run: python build_site.py --snapshot "$RUNNER_TEMP/research.json"
      - name: Require private website and data access before deployment
        run: python verify_private.py https://fantasygm2027-desert-rats.desertrat54.workers.dev
      - name: Deploy privately behind verified Cloudflare Access
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Recheck anonymous access after deployment
        run: python verify_private.py https://fantasygm2027-desert-rats.desertrat54.workers.dev
