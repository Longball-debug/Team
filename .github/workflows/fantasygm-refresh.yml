name: FantasyGM cloud refresh
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fantasygm-refresh.yml'
      - 'public_snapshot.py'
      - 'test_public_snapshot.py'
  schedule:
        - cron: '45 12 * * *'
permissions:
  contents: write
concurrency:
  group: fantasygm-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FANTRAX_USER_SECRET_ID: ${{ secrets.FANTRAX_USER_SECRET_ID }}
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: appA7fcI1VWfwOUXq
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify data handling
        run: python -m unittest discover -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify website freshness contract
        run: node --test test_snapshot_contract.mjs
      - name: Verify rendered website
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          node test_website_e2e.mjs
      - name: Validate configuration
        run: python cloud_sync.py --check-config
      - name: Collect Fantrax once
        run: python fantrax_refresh.py --root "$RUNNER_TEMP/fantasygm" --league-id gxq8uqpqmg5m5edj --no-prompt
      - name: Refresh shared Airtable data
        run: python cloud_sync.py --root "$RUNNER_TEMP/fantasygm"
      - name: Build complete sanitized website snapshot
        run: python public_snapshot.py --root "$RUNNER_TEMP/fantasygm"
      - name: Publish snapshot atomically
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fantasygm.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh sanitized FantasyGM website data'
          HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$HEADER" push origin HEAD:main
